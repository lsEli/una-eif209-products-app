<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <header class="page-header">
        <h1 th:text="${formTitle}">Formulario</h1>
        <a class="btn btn-secondary" th:href="@{/products}">Volver</a>
    </header>

    <section class="card">
        <form th:action="@{${formAction}}" th:object="${productForm}" method="post" class="form-layout">

            <div class="field">
                <label for="name">Nombre</label>
                <input id="name" type="text" th:field="*{name}">
                <small class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </div>

            <div class="field">
                <label for="price">Precio</label>
                <input id="price" type="number" step="0.01" th:field="*{price}">
                <small class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
            </div>

            <div class="field">
                <label for="categoryId">Categoría</label>
                <select id="categoryId" th:field="*{categoryId}">
                    <option value="">Seleccione una categoría</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}">
                    </option>
                </select>
                <small class="error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></small>
            </div>

            <div class="field">
                <label>Etiquetas</label>
                <div class="checkbox-group">
                    <label th:each="tag : ${tags}" class="check">
                        <input type="checkbox" th:field="*{tagIds}" th:value="${tag.id}">
                        <span th:text="${tag.name}">Tag</span>
                    </label>
                </div>
            </div>

            <div class="field">
                <label for="manufacturer">Fabricante</label>
                <input id="manufacturer" type="text" th:field="*{manufacturer}">
            </div>

            <div class="field">
                <label for="warrantyInfo">Garantía</label>
                <input id="warrantyInfo" type="text" th:field="*{warrantyInfo}">
            </div>

            <div class="field">
                <label for="description">Descripción</label>
                <textarea id="description" th:field="*{description}"></textarea>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Actualizar' : 'Crear'">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/products}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
