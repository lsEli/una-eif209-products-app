<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body>
<main class="container auth-container">
    <section class="card auth-card">
        <h1>Iniciar sesión</h1>

        <div class="alert alert-error" th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </div>

        <div class="alert alert-success" th:if="${param.logout}">
            Sesión cerrada correctamente.
        </div>

        <div class="alert alert-error" th:if="${param.expired}">
            Tu sesión expiró. Inicia sesión nuevamente.
        </div>

        <form th:action="@{/login}" method="post" class="form-layout">
            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" required>
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" required>
            </div>

            <label class="check">
                <input type="checkbox" name="remember-me">
                <span>Recordarme</span>
            </label>

            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <hr>

        <p><strong>Admin:</strong> admin / Admin123*</p>
        <p><strong>User:</strong> user / User123*</p>
    </section>
</main>
</body>
</html>
